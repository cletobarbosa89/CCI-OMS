# Azure App Service profile — activated by SPRING_PROFILES_ACTIVE=azure
# All sensitive values are injected as App Service environment variables,
# never hardcoded here.

# Disable docker-compose auto-start (infrastructure is managed by Azure)
spring.docker.compose.enabled=false

# Azure Database for PostgreSQL Flexible Server
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update

# Azure Cache for Redis
spring.data.redis.host=${SPRING_DATA_REDIS_HOST}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=true
spring.cache.type=redis

# Actuator — expose health for App Service health checks
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

# Structured INFO logging — App Service streams to Log Analytics
logging.level.root=INFO