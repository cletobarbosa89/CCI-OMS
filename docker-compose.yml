services:

  # ── Infrastructure ────────────────────────────────────────────────────────────

  postgres:
    image: postgres:15-alpine
    container_name: CCI-oms-postgres
    restart: always
    environment:
      POSTGRES_DB: oms_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: CCI-oms-redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --save "" --appendonly no

  # ── Microservices ─────────────────────────────────────────────────────────────

  inventory-service:
    build:
      context: .
      dockerfile: inventory-service/Dockerfile
    container_name: CCI-inventory-service
    restart: always
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/oms_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    depends_on:
      - postgres

  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    container_name: CCI-order-service
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/oms_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_DATA_REDIS_HOST: redis
      INVENTORY_SERVICE_URL: http://inventory-service:8081
      INVENTORY_SERVICE_ENABLED: "true"
      SPRING_PROFILES_ACTIVE: logging
      LOGSTASH_HOST: logstash
      LOGSTASH_PORT: "5044"
    depends_on:
      - postgres
      - redis
      - inventory-service
      - logstash

  # ── Monitoring — Prometheus + Grafana ─────────────────────────────────────────
  # Prometheus: http://localhost:9090
  # Grafana:    http://localhost:3000  (admin / admin)

  prometheus:
    image: prom/prometheus:latest
    container_name: CCI-oms-prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:latest
    container_name: CCI-oms-grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

  # ── Logging — ELK Stack ───────────────────────────────────────────────────────
  # Kibana:        http://localhost:5601
  # Elasticsearch: http://localhost:9200

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: CCI-oms-elasticsearch
    restart: always
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data

  logstash:
    image: docker.elastic.co/logstash/logstash:8.11.0
    container_name: CCI-oms-logstash
    restart: always
    ports:
      - "5044:5044"
    volumes:
      - ./monitoring/logstash/pipeline:/usr/share/logstash/pipeline:ro
    depends_on:
      - elasticsearch

  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: CCI-oms-kibana
    restart: always
    ports:
      - "5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    depends_on:
      - elasticsearch

  # ── Static Analysis — SonarQube  (docker compose --profile sonar up) ─────────
  # SonarQube at http://localhost:9000  (admin / admin on first login)
  # Then run:  mvn verify sonar:sonar -Psonar -pl order-service

  sonarqube:
    image: sonarqube:community
    container_name: CCI-oms-sonarqube
    profiles: ["sonar"]
    ports:
      - "9000:9000"
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions

volumes:
  postgres_data:
  grafana_data:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions:
  elasticsearch_data: