input {
  # Receives JSON log events from the app's LogstashTcpSocketAppender
  tcp {
    port => 5044
    codec => json_lines
  }
}

filter {
  # correlationId, level, logger, thread already present from logstash-logback-encoder
  mutate {
    add_field => { "service" => "oms" }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "oms-logs-%{+YYYY.MM.dd}"
  }
}