
# Application Name
spring.application.name=OMS

# PostgreSQL Database Connection
spring.datasource.url=jdbc:postgresql://localhost:5432/oms_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:postgres}

# Hibernate & JPA Configuration
spring.jpa.hibernate.ddl-auto=update

# Docker Compose integration — disabled by default; enabled only in dev profile
# (docker-compose.yml lives in the parent directory, not the module directory)
spring.docker.compose.enabled=false

# Actuator — expose health, info, and Prometheus metrics endpoint
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

# Inventory microservice (set to true + start inventory-service to use real adapter)
inventory.service.enabled=false
inventory.service.url=http://localhost:8081