# In-memory H2 datasource for unit/slice tests
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
# Prevents spring-boot-docker-compose from starting docker-compose.yml during full context tests
spring.docker.compose.enabled=false
# Use simple in-memory cache in tests — avoids Redis dependency, @Cacheable annotations still exercised
spring.cache.type=simple