apiVersion: apps/v1
kind: Deployment
metadata:
  name: oms-deployment
  labels:
    app: oms
spec:
  replicas: 2
  selector:
    matchLabels:
      app: oms
  template:
    metadata:
      labels:
        app: oms
    spec:
      containers:
        - name: oms
          image: cletobarbosa89/oms:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: oms-config
          env:
            # DB password comes from a Secret, not a ConfigMap
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: oms-secrets
                  key: db-password
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"